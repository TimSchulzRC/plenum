name: Funktion vorschlagen
description: Eine Idee für Teams Everywhere.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll die Funktion lösen?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Wie stellst du dir die Lösung vor?
  - type: checkboxes
    id: webapp
    attributes:
      label: Web-App
      options:
        - label: Die Funktion gibt es in der Teams-Web-App (teams.microsoft.com).
