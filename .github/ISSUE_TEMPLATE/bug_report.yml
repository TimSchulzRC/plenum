name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was kam stattdessen?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Chat öffnen
        2. Nachricht mit Bild senden
        3. …
  - type: input
    id: version
    attributes:
      label: App-Version
      description: Steht unter „Über Teams Everywhere“, z. B. 0.1.0-nightly.20261118.12
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS-Version und Mac
      placeholder: macOS 26.1, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log-Auszug
      description: "Aus ~/Library/Application Support/Teams Everywhere/logs/main.log. Bitte vorher Namen, Mailadressen und Nachrichteninhalte entfernen."
      render: text
